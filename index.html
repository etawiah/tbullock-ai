<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tom Bullock - Your Home AI personal mixologist with inventory management and classic cocktail recipes" />
    <meta name="theme-color" content="#667eea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e1b4b" />

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tom Bullock" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <title>🍹 Tom Bullock - Home AI personal mixologist</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        /* #20: Prevent double-tap zoom */
        touch-action: manipulation;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        /* #21: Safe area insets for notched devices */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }

      #root {
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
      }

      /* #1: Ensure minimum 16px font size on mobile to prevent iOS zoom */
      input, select, textarea, button {
        font-size: 16px;
      }

      /* iOS zooms into any field under 16px when you tap it. Pinch-zoom is
         allowed again (for accessibility), so keep phone fields at 16px. */
      @media (max-width: 767px) {
        input, select, textarea {
          font-size: 16px !important;
        }
      }

      @media (min-width: 768px) {
        input, select, textarea, button {
          font-size: 14px;
        }
      }

      /* Visible keyboard focus */
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
        outline: 3px solid #f59e0b;
        outline-offset: 2px;
      }

      /* #7: Dark mode theming */
      body.dark-mode {
        background: #1a1a2e;
        color: #e0e0e0;
      }

      body.dark-mode #root {
        background: #1a1a2e;
      }

      /* Dark mode overrides for common elements */
      body.dark-mode input:not([type="checkbox"]):not([type="radio"]),
      body.dark-mode select,
      body.dark-mode textarea {
        background: #2d2d44;
        color: #e0e0e0;
        border-color: #3d3d5c;
      }

      body.dark-mode input::placeholder,
      body.dark-mode textarea::placeholder {
        color: #888;
      }

      /* Dark mode for the inline-styled React UI. Components hard-code light
         colours inline, so these rules remap the few light surfaces and grey
         text colours they use (matched on the browser's serialised style
         attribute). Coloured buttons and badges are left untouched. */
      body.dark-mode { color-scheme: dark; }
      body.dark-mode [style*="background: white"],
      body.dark-mode [style*="background: rgb(255, 255, 255)"] { background: #24253a !important; }
      body.dark-mode [style*="background: rgb(249, 250, 251)"] { background: #2c2e46 !important; }
      body.dark-mode [style*="background: rgb(245, 245, 245)"] { background: #17182b !important; }
      body.dark-mode [style*="background: rgb(243, 244, 246)"],
      body.dark-mode [style*="background: rgb(229, 231, 235)"] { background: #34365a !important; }
      body.dark-mode [style*="background: rgb(254, 243, 199)"] { background: #3a3220 !important; }
      body.dark-mode [style*="background: rgb(239, 246, 255)"] { background: #263463 !important; }
      body.dark-mode [style*="background: rgb(254, 242, 242)"] { background: #3b1d24 !important; }
      body.dark-mode [style*="color: rgb(17, 17, 17)"],
      body.dark-mode [style*="color: rgb(51, 51, 51)"] { color: #f1f1f6 !important; }
      body.dark-mode [style*="color: rgb(55, 65, 81)"],
      body.dark-mode [style*="color: rgb(75, 85, 99)"] { color: #d4d6e4 !important; }
      body.dark-mode [style*="color: rgb(107, 114, 128)"],
      body.dark-mode [style*="color: rgb(102, 102, 102)"],
      body.dark-mode [style*="color: rgb(153, 153, 153)"] { color: #b3b6c9 !important; }
      body.dark-mode [style*="color: rgb(153, 27, 27)"],
      body.dark-mode [style*="color: rgb(220, 38, 38)"] { color: #fca5a5 !important; }
      body.dark-mode [style*="color: rgb(5, 150, 105)"],
      body.dark-mode [style*="color: rgb(4, 120, 87)"] { color: #6ee7b7 !important; }
      body.dark-mode [style*="color: rgb(185, 28, 28)"] { color: #fca5a5 !important; }
      body.dark-mode [style*="color: rgb(67, 56, 202)"] { color: #a5b4fc !important; }
      body.dark-mode [style*="border: 1px solid rgb(229, 231, 235)"],
      body.dark-mode [style*="border: 1px solid rgb(209, 213, 219)"],
      body.dark-mode [style*="border-top: 1px solid rgb(229, 231, 235)"],
      body.dark-mode [style*="border-top: 1px solid rgb(224, 224, 224)"] { border-color: #3d3f5c !important; }

      /* #5: Pull-to-refresh spinner animation */
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* #6: Bottom sheet slide-up animation */
      @keyframes slideUp {
        from {
          transform: translateY(100%);
        }
        to {
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
